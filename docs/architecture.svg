<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- Warm cream background -->
  <rect width="1200" height="760" fill="#F5EEDB"/>

  <!-- Decorative asterisks scattered in negative space -->
  <g opacity="0.55">
    <g transform="translate(60,80)"><path d="M0,-14 L0,14 M-14,0 L14,0 M-10,-10 L10,10 M-10,10 L10,-10" stroke="#F2A6A0" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(1140,170)"><path d="M0,-10 L0,10 M-10,0 L10,0 M-7,-7 L7,7 M-7,7 L7,-7" stroke="#F2A6A0" stroke-width="2.5" stroke-linecap="round"/></g>
    <g transform="translate(1150,540)"><path d="M0,-12 L0,12 M-12,0 L12,0 M-8,-8 L8,8 M-8,8 L8,-8" stroke="#F2A6A0" stroke-width="2.8" stroke-linecap="round"/></g>
    <g transform="translate(40,640)"><path d="M0,-10 L0,10 M-10,0 L10,0 M-7,-7 L7,7 M-7,7 L7,-7" stroke="#F2A6A0" stroke-width="2.5" stroke-linecap="round"/></g>
    <g transform="translate(625,720)"><path d="M0,-8 L0,8 M-8,0 L8,0 M-5,-5 L5,5 M-5,5 L5,-5" stroke="#F2A6A0" stroke-width="2" stroke-linecap="round"/></g>
  </g>

  <!-- Header -->
  <text x="600" y="78" fill="#1F1B16" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="-0.5">claude-agent-os</text>
  <text x="600" y="112" fill="#5C544A" font-size="20" text-anchor="middle">Built for operators who live in Claude Code.</text>

  <!-- Friendly terminal mascot upper right -->
  <g transform="translate(1050,55)">
    <rect x="0" y="0" width="80" height="60" rx="10" fill="#1F1B16"/>
    <rect x="6" y="6" width="68" height="48" rx="6" fill="#F5EEDB"/>
    <circle cx="22" cy="26" r="3" fill="#1F1B16"/>
    <circle cx="58" cy="26" r="3" fill="#1F1B16"/>
    <path d="M28,40 Q40,46 52,40" stroke="#1F1B16" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="32" y="60" width="16" height="6" fill="#1F1B16"/>
    <rect x="20" y="66" width="40" height="3" rx="1.5" fill="#1F1B16"/>
  </g>

  <!-- Routing brain -->
  <g transform="translate(340,150)">
    <rect x="0" y="0" width="520" height="70" rx="14" fill="#E8C26B" stroke="#1F1B16" stroke-width="2"/>
    <text x="260" y="32" fill="#1F1B16" font-size="20" font-weight="700" text-anchor="middle">CLAUDE.md — routing brain</text>
    <text x="260" y="56" fill="#1F1B16" font-size="13" text-anchor="middle" opacity="0.78" font-family="ui-monospace, 'SF Mono', monospace">intent → skill · intent → persona · intent → agent</text>
  </g>

  <!-- Column headers -->
  <text x="135" y="265" fill="#5C544A" font-size="13" text-anchor="middle" font-weight="600" letter-spacing="1">DATA SOURCES</text>
  <text x="600" y="265" fill="#5C544A" font-size="13" text-anchor="middle" font-weight="600" letter-spacing="1">ALWAYS-ON AGENTS</text>
  <text x="1065" y="265" fill="#5C544A" font-size="13" text-anchor="middle" font-weight="600" letter-spacing="1">OUTPUTS</text>

  <!-- Left: data sources -->
  <g transform="translate(60,285)">
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#7DB4D6" stroke="#1F1B16" stroke-width="2"/>
    <text x="75" y="26" fill="#1F1B16" font-size="16" font-weight="600" text-anchor="middle">Gmail</text>
    <text x="75" y="44" fill="#1F1B16" font-size="11" text-anchor="middle" opacity="0.78">inbox · drafts · labels</text>
  </g>
  <g transform="translate(60,360)">
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#7FC2B5" stroke="#1F1B16" stroke-width="2"/>
    <text x="75" y="26" fill="#1F1B16" font-size="16" font-weight="600" text-anchor="middle">Google Calendar</text>
    <text x="75" y="44" fill="#1F1B16" font-size="11" text-anchor="middle" opacity="0.78">bookings · invites</text>
  </g>
  <g transform="translate(60,435)">
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#A893C7" stroke="#1F1B16" stroke-width="2"/>
    <text x="75" y="26" fill="#1F1B16" font-size="16" font-weight="600" text-anchor="middle">GitHub</text>
    <text x="75" y="44" fill="#1F1B16" font-size="11" text-anchor="middle" opacity="0.78">repo stats · issues</text>
  </g>

  <!-- Arrows: sources → agents -->
  <g stroke="#1F1B16" stroke-width="2" fill="none" stroke-dasharray="5,4" opacity="0.55">
    <path d="M215,313 Q280,313 340,313" stroke-linecap="round"/>
    <path d="M215,388 Q280,388 340,388" stroke-linecap="round"/>
    <path d="M215,463 Q280,463 340,463" stroke-linecap="round"/>
  </g>
  <g fill="#1F1B16" opacity="0.7">
    <polygon points="340,313 332,309 332,317"/>
    <polygon points="340,388 332,384 332,392"/>
    <polygon points="340,463 332,459 332,467"/>
  </g>

  <!-- Center: three always-on agents -->
  <g transform="translate(340,285)">
    <rect x="0" y="0" width="520" height="65" rx="12" fill="#EFA76B" stroke="#1F1B16" stroke-width="2"/>
    <text x="20" y="28" fill="#1F1B16" font-size="18" font-weight="700">Reply Handler</text>
    <text x="20" y="50" fill="#1F1B16" font-size="13" opacity="0.82">classifies inbox replies · drafts responses · 8 categories</text>
    <g transform="translate(415,18)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#1F1B16"/>
      <text x="45" y="19" fill="#F5EEDB" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">every 30 min</text>
    </g>
  </g>

  <g transform="translate(340,360)">
    <rect x="0" y="0" width="520" height="65" rx="12" fill="#94BD8E" stroke="#1F1B16" stroke-width="2"/>
    <text x="20" y="28" fill="#1F1B16" font-size="18" font-weight="700">Calendar Booking</text>
    <text x="20" y="50" fill="#1F1B16" font-size="13" opacity="0.82">detects new invites · generates prep docs · loop-closes outreach</text>
    <g transform="translate(415,18)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#1F1B16"/>
      <text x="45" y="19" fill="#F5EEDB" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">every 15 min</text>
    </g>
  </g>

  <g transform="translate(340,435)">
    <rect x="0" y="0" width="520" height="65" rx="12" fill="#D67E78" stroke="#1F1B16" stroke-width="2"/>
    <text x="20" y="28" fill="#1F1B16" font-size="18" font-weight="700">Morning Brief</text>
    <text x="20" y="50" fill="#F5EEDB" font-size="13" opacity="0.95">top-3 priorities · pipeline state · OS health · plugin stats</text>
    <g transform="translate(395,18)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#1F1B16"/>
      <text x="55" y="19" fill="#F5EEDB" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">Mon–Fri 7AM</text>
    </g>
  </g>

  <!-- Arrows: agents → outputs -->
  <g stroke="#1F1B16" stroke-width="2" fill="none" stroke-dasharray="5,4" opacity="0.55">
    <path d="M860,313 Q925,313 990,313" stroke-linecap="round"/>
    <path d="M860,388 Q925,388 990,388" stroke-linecap="round"/>
    <path d="M860,463 Q925,463 990,463" stroke-linecap="round"/>
  </g>
  <g fill="#1F1B16" opacity="0.7">
    <polygon points="990,313 982,309 982,317"/>
    <polygon points="990,388 982,384 982,392"/>
    <polygon points="990,463 982,459 982,467"/>
  </g>

  <!-- Right: outputs -->
  <g transform="translate(990,285)">
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#F5D4B6" stroke="#1F1B16" stroke-width="2"/>
    <text x="75" y="26" fill="#1F1B16" font-size="14" font-weight="600" text-anchor="middle">Reply drafts</text>
    <text x="75" y="44" fill="#1F1B16" font-size="11" text-anchor="middle" opacity="0.78">queued in Gmail</text>
  </g>
  <g transform="translate(990,360)">
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#C6DDC0" stroke="#1F1B16" stroke-width="2"/>
    <text x="75" y="26" fill="#1F1B16" font-size="14" font-weight="600" text-anchor="middle">Prep docs</text>
    <text x="75" y="44" fill="#1F1B16" font-size="11" text-anchor="middle" opacity="0.78">per-meeting markdown</text>
  </g>
  <g transform="translate(990,435)">
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#EFC4C0" stroke="#1F1B16" stroke-width="2"/>
    <text x="75" y="26" fill="#1F1B16" font-size="14" font-weight="600" text-anchor="middle">Daily brief</text>
    <text x="75" y="44" fill="#1F1B16" font-size="11" text-anchor="middle" opacity="0.78">to your inbox 7AM</text>
  </g>

  <!-- Hook layer banner wrapping the bottom -->
  <g transform="translate(60,540)">
    <rect x="0" y="0" width="1080" height="100" rx="14" fill="#A88FBE" stroke="#1F1B16" stroke-width="2"/>
    <text x="20" y="32" fill="#1F1B16" font-size="18" font-weight="700">Hook layer · safety as architecture</text>
    <text x="20" y="54" fill="#1F1B16" font-size="13" opacity="0.85">Every Claude Code tool call passes through these. The router can't disable them.</text>

    <g transform="translate(630,20)">
      <rect x="0" y="0" width="200" height="60" rx="10" fill="#F5EEDB" stroke="#1F1B16" stroke-width="2"/>
      <text x="100" y="22" fill="#1F1B16" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">pre-tool-use</text>
      <text x="100" y="42" fill="#1F1B16" font-size="10" text-anchor="middle" opacity="0.78" font-family="ui-monospace, 'SF Mono', monospace">block-dangerous-commands.js</text>
    </g>
    <g transform="translate(850,20)">
      <rect x="0" y="0" width="200" height="60" rx="10" fill="#F5EEDB" stroke="#1F1B16" stroke-width="2"/>
      <text x="100" y="22" fill="#1F1B16" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">post-tool-use</text>
      <text x="100" y="42" fill="#1F1B16" font-size="10" text-anchor="middle" opacity="0.78" font-family="ui-monospace, 'SF Mono', monospace">dispatcher.js</text>
    </g>
  </g>

  <!-- Footer caption -->
  <g transform="translate(0,680)">
    <text x="600" y="22" fill="#5C544A" font-size="14" text-anchor="middle" opacity="0.78">CLAUDE.md loads first. Skills load on demand. Agents work while you sleep.</text>
    <text x="600" y="48" fill="#5C544A" font-size="12" text-anchor="middle" opacity="0.6" font-family="ui-monospace, 'SF Mono', monospace">~/.agent-os/  ·  MIT  ·  github.com/beckwith930-star/claude-agent-os</text>
  </g>

</svg>
