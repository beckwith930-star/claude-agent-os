<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#F5EEDB"/>

  <!-- Decorative asterisks -->
  <g opacity="0.5">
    <g transform="translate(80,90)"><path d="M0,-22 L0,22 M-22,0 L22,0 M-15,-15 L15,15 M-15,15 L15,-15" stroke="#F2A6A0" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(1110,140)"><path d="M0,-14 L0,14 M-14,0 L14,0 M-10,-10 L10,10 M-10,10 L10,-10" stroke="#F2A6A0" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(60,550)"><path d="M0,-12 L0,12 M-12,0 L12,0 M-8,-8 L8,8 M-8,8 L8,-8" stroke="#F2A6A0" stroke-width="2.8" stroke-linecap="round"/></g>
    <g transform="translate(1130,510)"><path d="M0,-16 L0,16 M-16,0 L16,0 M-11,-11 L11,11 M-11,11 L11,-11" stroke="#F2A6A0" stroke-width="3" stroke-linecap="round"/></g>
  </g>

  <!-- Left side: title + tagline -->
  <g transform="translate(80,180)">
    <!-- Accent line under wordmark -->
    <rect x="0" y="110" width="120" height="6" rx="3" fill="#D67E78"/>

    <text x="0" y="0" fill="#1F1B16" font-size="78" font-weight="700" letter-spacing="-1.5">claude-</text>
    <text x="0" y="86" fill="#1F1B16" font-size="78" font-weight="700" letter-spacing="-1.5">agent-os</text>

    <text x="0" y="180" fill="#1F1B16" font-size="30" font-weight="600">Built for operators who live</text>
    <text x="0" y="216" fill="#1F1B16" font-size="30" font-weight="600">in Claude Code.</text>

    <text x="0" y="280" fill="#5C544A" font-size="18" opacity="0.78">always-on inbox agents · routing brain · safety hooks</text>

    <!-- Pills row -->
    <g transform="translate(0,310)">
      <g>
        <rect x="0" y="0" width="120" height="32" rx="16" fill="#EFA76B" stroke="#1F1B16" stroke-width="2"/>
        <text x="60" y="21" fill="#1F1B16" font-size="13" font-weight="700" text-anchor="middle">replies</text>
      </g>
      <g transform="translate(132,0)">
        <rect x="0" y="0" width="120" height="32" rx="16" fill="#94BD8E" stroke="#1F1B16" stroke-width="2"/>
        <text x="60" y="21" fill="#1F1B16" font-size="13" font-weight="700" text-anchor="middle">bookings</text>
      </g>
      <g transform="translate(264,0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#D67E78" stroke="#1F1B16" stroke-width="2"/>
        <text x="70" y="21" fill="#F5EEDB" font-size="13" font-weight="700" text-anchor="middle">morning brief</text>
      </g>
    </g>
  </g>

  <!-- Right side: stacked terminal-window cards as architecture motif -->
  <g transform="translate(720,140)">
    <!-- Card 3 (back) - golden routing brain -->
    <g transform="translate(60,0)">
      <rect x="0" y="0" width="380" height="100" rx="14" fill="#E8C26B" stroke="#1F1B16" stroke-width="2"/>
      <text x="22" y="32" fill="#1F1B16" font-size="16" font-weight="700">CLAUDE.md — routing brain</text>
      <text x="22" y="58" fill="#1F1B16" font-size="12" opacity="0.78" font-family="ui-monospace, 'SF Mono', monospace">intent → skill · persona · agent</text>
      <text x="22" y="80" fill="#1F1B16" font-size="11" opacity="0.65" font-family="ui-monospace, 'SF Mono', monospace">~/.agent-os/CLAUDE.md</text>
    </g>

    <!-- Card 2 (middle) - green calendar -->
    <g transform="translate(30,120)">
      <rect x="0" y="0" width="380" height="100" rx="14" fill="#94BD8E" stroke="#1F1B16" stroke-width="2"/>
      <text x="22" y="32" fill="#1F1B16" font-size="16" font-weight="700">Calendar Booking</text>
      <text x="22" y="58" fill="#1F1B16" font-size="12" opacity="0.82">prep docs · loop closure · 15 min</text>
      <g transform="translate(280,16)">
        <rect x="0" y="0" width="80" height="22" rx="11" fill="#1F1B16"/>
        <text x="40" y="15" fill="#F5EEDB" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">15 min</text>
      </g>
    </g>

    <!-- Card 1 (front) - coral morning brief -->
    <g transform="translate(0,240)">
      <rect x="0" y="0" width="380" height="100" rx="14" fill="#D67E78" stroke="#1F1B16" stroke-width="2"/>
      <text x="22" y="32" fill="#1F1B16" font-size="16" font-weight="700">Morning Brief</text>
      <text x="22" y="58" fill="#F5EEDB" font-size="12" opacity="0.95">top-3 priorities · pipeline state</text>
      <g transform="translate(260,16)">
        <rect x="0" y="0" width="100" height="22" rx="11" fill="#1F1B16"/>
        <text x="50" y="15" fill="#F5EEDB" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">Mon–Fri 7AM</text>
      </g>
    </g>
  </g>

  <!-- Friendly terminal mascot above right cards -->
  <g transform="translate(990,40)">
    <rect x="0" y="0" width="80" height="60" rx="10" fill="#1F1B16"/>
    <rect x="6" y="6" width="68" height="48" rx="6" fill="#F5EEDB"/>
    <circle cx="22" cy="26" r="3" fill="#1F1B16"/>
    <circle cx="58" cy="26" r="3" fill="#1F1B16"/>
    <path d="M28,40 Q40,46 52,40" stroke="#1F1B16" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="32" y="60" width="16" height="6" fill="#1F1B16"/>
    <rect x="20" y="66" width="40" height="3" rx="1.5" fill="#1F1B16"/>
  </g>

  <!-- Footer -->
  <g transform="translate(80,575)">
    <text x="0" y="0" fill="#5C544A" font-size="16" opacity="0.78" font-family="ui-monospace, 'SF Mono', monospace">github.com/beckwith930-star/claude-agent-os</text>
    <text x="1040" y="0" fill="#5C544A" font-size="14" opacity="0.65" text-anchor="end">MIT licensed · macOS</text>
  </g>

</svg>
