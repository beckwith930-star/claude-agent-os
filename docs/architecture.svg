<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4f4f0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#0a1730"/>

  <!-- Hook layer wrapper -->
  <rect x="30" y="30" width="1140" height="615" rx="14" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.55"/>
  <rect x="50" y="20" width="240" height="22" fill="#0a1730"/>
  <text x="60" y="36" fill="#00d4ff" font-size="13" letter-spacing="1">hook layer · pre/post tool-use</text>

  <!-- Data sources (left) -->
  <g>
    <rect x="70" y="120" width="180" height="60" rx="6" fill="#0a1730" stroke="#f4f4f0" stroke-width="1.2"/>
    <text x="160" y="148" fill="#f4f4f0" font-size="16" text-anchor="middle">Gmail</text>
    <text x="160" y="168" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.7">inbox · drafts · labels</text>

    <rect x="70" y="305" width="180" height="60" rx="6" fill="#0a1730" stroke="#f4f4f0" stroke-width="1.2"/>
    <text x="160" y="333" fill="#f4f4f0" font-size="16" text-anchor="middle">Calendar</text>
    <text x="160" y="353" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.7">new bookings</text>

    <rect x="70" y="490" width="180" height="60" rx="6" fill="#0a1730" stroke="#f4f4f0" stroke-width="1.2"/>
    <text x="160" y="518" fill="#f4f4f0" font-size="16" text-anchor="middle">GitHub</text>
    <text x="160" y="538" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.7">repos · issues · stars</text>
  </g>

  <!-- Center: terminal / ~/.agent-os/ -->
  <g>
    <rect x="430" y="240" width="340" height="195" rx="10" fill="#0a1730" stroke="#00d4ff" stroke-width="2"/>
    <!-- terminal chrome -->
    <rect x="430" y="240" width="340" height="26" rx="10" fill="#00d4ff" opacity="0.12"/>
    <circle cx="448" cy="253" r="4" fill="#f4f4f0" opacity="0.5"/>
    <circle cx="462" cy="253" r="4" fill="#f4f4f0" opacity="0.5"/>
    <circle cx="476" cy="253" r="4" fill="#f4f4f0" opacity="0.5"/>
    <text x="600" y="258" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.6">terminal</text>

    <text x="600" y="300" fill="#00d4ff" font-size="20" text-anchor="middle">~/.agent-os/</text>
    <text x="600" y="328" fill="#f4f4f0" font-size="13" text-anchor="middle" opacity="0.85">routing brain · CLAUDE.md</text>
    <text x="600" y="350" fill="#f4f4f0" font-size="13" text-anchor="middle" opacity="0.85">personas · skills · agents</text>
    <text x="600" y="372" fill="#f4f4f0" font-size="13" text-anchor="middle" opacity="0.85">MEMORY.md · BRAND.md</text>
    <text x="600" y="408" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.55">directory-scoped · persistent</text>
  </g>

  <!-- Three always-on agents (top center band) -->
  <g>
    <rect x="430" y="80" width="340" height="120" rx="8" fill="#0a1730" stroke="#00d4ff" stroke-width="1.3" opacity="0.95"/>
    <text x="600" y="104" fill="#00d4ff" font-size="13" text-anchor="middle" letter-spacing="1">always-on agents · launchd</text>

    <line x1="445" y1="115" x2="755" y2="115" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

    <text x="445" y="138" fill="#f4f4f0" font-size="13">reply-handler</text>
    <text x="755" y="138" fill="#00d4ff" font-size="12" text-anchor="end">every 30m</text>

    <text x="445" y="160" fill="#f4f4f0" font-size="13">calendar-booking</text>
    <text x="755" y="160" fill="#00d4ff" font-size="12" text-anchor="end">every 15m</text>

    <text x="445" y="182" fill="#f4f4f0" font-size="13">morning-brief</text>
    <text x="755" y="182" fill="#00d4ff" font-size="12" text-anchor="end">Mon–Fri 7AM</text>
  </g>

  <!-- Outputs (right) -->
  <g>
    <rect x="950" y="120" width="180" height="60" rx="6" fill="#0a1730" stroke="#f4f4f0" stroke-width="1.2"/>
    <text x="1040" y="148" fill="#f4f4f0" font-size="16" text-anchor="middle">Gmail drafts</text>
    <text x="1040" y="168" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.7">classified replies</text>

    <rect x="950" y="305" width="180" height="60" rx="6" fill="#0a1730" stroke="#f4f4f0" stroke-width="1.2"/>
    <text x="1040" y="333" fill="#f4f4f0" font-size="16" text-anchor="middle">prep docs</text>
    <text x="1040" y="353" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.7">per booking</text>

    <rect x="950" y="490" width="180" height="60" rx="6" fill="#0a1730" stroke="#f4f4f0" stroke-width="1.2"/>
    <text x="1040" y="518" fill="#f4f4f0" font-size="16" text-anchor="middle">morning brief</text>
    <text x="1040" y="538" fill="#f4f4f0" font-size="11" text-anchor="middle" opacity="0.7">top-3 priorities</text>
  </g>

  <!-- Inbound arrows -->
  <line x1="250" y1="150" x2="425" y2="280" stroke="#f4f4f0" stroke-width="1.4" opacity="0.7" marker-end="url(#arrow-warm)"/>
  <line x1="250" y1="335" x2="425" y2="335" stroke="#f4f4f0" stroke-width="1.4" opacity="0.7" marker-end="url(#arrow-warm)"/>
  <line x1="250" y1="520" x2="425" y2="395" stroke="#f4f4f0" stroke-width="1.4" opacity="0.7" marker-end="url(#arrow-warm)"/>

  <!-- Outbound arrows -->
  <line x1="775" y1="280" x2="945" y2="150" stroke="#00d4ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="775" y1="335" x2="945" y2="335" stroke="#00d4ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="775" y1="395" x2="945" y2="520" stroke="#00d4ff" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Connector from agents box to core -->
  <line x1="600" y1="200" x2="600" y2="240" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Caption row -->
  <text x="600" y="600" fill="#f4f4f0" font-size="13" text-anchor="middle" opacity="0.6">claude-agent-os · persistent layer above one-off Claude Code sessions</text>

  <!-- Corner label -->
  <text x="1140" y="630" fill="#f4f4f0" font-size="10" text-anchor="end" opacity="0.5">MIT · github.com/beckwith930-star/claude-agent-os</text>
</svg>
