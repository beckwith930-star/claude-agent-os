  <!-- ═════ Header ═════ -->
  <text x="600" y="55" fill="#1F1B16" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="-0.4">claude-agent-os</text>
  <text x="600" y="80" fill="#5C544A" font-size="15" text-anchor="middle">Built for operators who live in Claude Code.</text>

  <!-- ═════ Orbit rings (faint dashed circles) ═════ -->
  <g fill="none" stroke="#1F1B16" stroke-dasharray="3,5" opacity="0.18">
