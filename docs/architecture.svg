    <g transform="translate(820,90)"><path d="M0,-5 L0,5 M-5,0 L5,0 M-3.5,-3.5 L3.5,3.5 M-3.5,3.5 L3.5,-3.5" stroke="#F2A6A0" stroke-width="1.6" stroke-linecap="round"/></g>
    <g transform="translate(950,140)"><path d="M0,-4 L0,4 M-4,0 L4,0" stroke="#F2A6A0" stroke-width="1.5" stroke-linecap="round"/></g>
    <g transform="translate(1080,90)"><path d="M0,-6 L0,6 M-6,0 L6,0 M-4,-4 L4,4 M-4,4 L4,-4" stroke="#F2A6A0" stroke-width="1.8" stroke-linecap="round"/></g>
    <g transform="translate(80,400)"><path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#F2A6A0" stroke-width="1.6" stroke-linecap="round"/></g>
    <g transform="translate(1140,400)"><path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#F2A6A0" stroke-width="1.6" stroke-linecap="round"/></g>
