    <line x1="600" y1="522" x2="600" y2="536"/>
    <line x1="498" y1="420" x2="484" y2="420"/>
    <line x1="702" y1="420" x2="716" y2="420"/>
    <line x1="528" y1="348" x2="518" y2="338"/>
    <line x1="672" y1="492" x2="682" y2="502"/>
    <line x1="672" y1="348" x2="682" y2="338"/>
    <line x1="528" y1="492" x2="518" y2="502"/>
