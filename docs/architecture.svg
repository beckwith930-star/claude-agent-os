  <!-- ═════ Footer ═════ -->
  <text x="600" y="730" fill="#5C544A" font-size="11" text-anchor="middle" opacity="0.65" font-family="ui-monospace, 'SF Mono', monospace">~/.agent-os/  ·  MIT  ·  github.com/beckwith930-star/claude-agent-os</text>

